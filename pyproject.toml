[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xlsx2txt"
dynamic = ["version"]
description = "Bidirectional Excel converter (xlsx ↔ text) for Git version control"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Vladyslav V. Prodan", email = "admin@support.od.ua"}
]
keywords = ["excel", "xlsx", "json", "git", "version-control", "converter"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Version Control :: Git",
]
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.0",
    "click>=8.0.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
vba = [
    "oletools>=0.60",
]
dev = [
    "oletools>=0.60",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
xlsx2txt = "xlsx2txt.cli:main"

[project.urls]
Homepage = "https://github.com/click0/xlsx2txt"
Repository = "https://github.com/click0/xlsx2txt"
Issues = "https://github.com/click0/xlsx2txt/issues"
Changelog = "https://github.com/click0/xlsx2txt/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "xlsx2txt.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["xlsx2txt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
